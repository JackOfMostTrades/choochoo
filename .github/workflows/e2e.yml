name: E2E Tests

on:
  workflow_dispatch:

jobs:
  run-e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    services:
      mariadb:
        # Pinned to match production; `latest` drifts to newer majors.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: choochoo
          MARIADB_DATABASE: choochootest
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - run: sudo apt-get update
      - run: sudo apt-get install unzip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate-testdb-direct
        env:
          DATABASE_URL: "mariadb://root:choochoo@localhost:${{ job.services.mariadb.ports[3306] }}/choochootest"
          NODE_ENV: "test"

      - name: Run E2E tests
        run: ./src/scripts/deflake.sh "npm run e2e-test"
        env:
          DATABASE_URL: "mariadb://root:choochoo@localhost:${{ job.services.mariadb.ports[3306] }}/choochootest"
          NODE_ENV: "test"
          PORT: 3001
