services:
  mariadb:
    # Pinned to match production (11.4.x); `latest` drifts to newer majors.
    image: mariadb:11.4
    container_name: choochoo-mariadb
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_uca1400_as_cs
    environment:
      MARIADB_DATABASE: choochoo
      MARIADB_USER: choochoo
      MARIADB_PASSWORD: choochoo
      MARIADB_ROOT_PASSWORD: choochoo
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: choochoo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: choochoo-app
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: mariadb://choochoo:choochoo@mariadb:3306/choochoo
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: foobar-dev
      PORT: 3000
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /app/node_modules
      - /app/dist
    command: sh -c "npm run build-server && npm run migrate && npm run dev"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

volumes:
  mariadb_data:
  redis_data: 
